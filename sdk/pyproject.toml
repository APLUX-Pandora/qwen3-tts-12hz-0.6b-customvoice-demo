[build-system]
requires = ["setuptools>=68", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "pandora-qwen3-tts-12hz-0-6b-customvoice"
version = "1.0.0"
description = "Qwen3-TTS CustomVoice inference SDK for Linux AArch64"
license = {text = "Apache-2.0 Python bindings; native binary components retain the bundled component-specific terms."}
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.26,<2"]
